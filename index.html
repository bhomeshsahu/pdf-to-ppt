<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF to PPT Converter</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
    body { background: linear-gradient(to right, #667eea, #764ba2); font-family: 'Poppins', sans-serif; }
    .upload-box { transition: 0.3s ease; }
    .upload-box:hover { transform: scale(1.05); }
    .loader {
      display: none; border: 4px solid #f3f3f3; border-top: 4px solid #3498db;
      border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white">
  <div class="bg-white bg-opacity-10 p-10 rounded-2xl shadow-xl text-center upload-box w-11/12 md:w-2/3 lg:w-1/2">
    <h1 class="text-4xl font-bold mb-6">PDF to PPT Converter 💻</h1>
    <p class="text-gray-200 mb-6">Convert your PDF pages into beautiful PowerPoint slides — 100% offline!</p>

    <form id="uploadForm" action="/convert" method="post" enctype="multipart/form-data" class="flex flex-col items-center gap-4">
      <input type="file" name="pdf_file" accept=".pdf" required
             class="bg-white text-gray-700 px-4 py-2 rounded shadow-md cursor-pointer w-64">
      <button type="submit"
              class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-2 rounded-lg shadow-md transition">
        Convert Now
      </button>
    </form>

    <!-- Loader -->
    <div id="loader" class="loader"></div>
    <p id="loadingText" class="text-gray-300 mt-3" style="display:none;">Converting, please wait...</p>

    <div class="mt-6 text-sm text-gray-300">
      No internet required. Your files stay private.
    </div>
  </div>

  <footer class="mt-10 text-gray-200 text-sm">
    © 2025 PDF to PPT Converter | Made with ❤️ by You
  </footer>

  <script>
    const form = document.getElementById('uploadForm');
    const loader = document.getElementById('loader');
    const loadingText = document.getElementById('loadingText');

    form.addEventListener('submit', () => {
      loader.style.display = 'block';
      loadingText.style.display = 'block';
    });
  </script>
</body>
</html>
